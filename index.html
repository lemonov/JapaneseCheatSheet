  <head>
    <meta charset="UTF-8" />

    <title>Japanese Cheat Sheet</title>
    <style>
:root {
  --bg-color: #0f172a; /* Deep slate / navy blue */
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent-neon-pink: #ec4899;
  --accent-neon-cyan: #06b6d4;
  --accent-neon-purple: #8b5cf6;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --card-radius: 16px;
  
  --staff-bg: rgba(6, 182, 212, 0.1); /* Cyan tint */
  --staff-border: rgba(6, 182, 212, 0.3);
  --user-bg: rgba(236, 72, 153, 0.1); /* Pink tint */
  --user-border: rgba(236, 72, 153, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', 'Outfit', sans-serif;
  background: var(--bg-gradient);
  background-color: var(--bg-color);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#root {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Glassmorphism utility */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--card-radius);
}

/* Container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
  width: 100%;
}

/* Header */
.header {
  padding: 1.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--glass-border);
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  background: -webkit-linear-gradient(45deg, var(--accent-neon-cyan), var(--accent-neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 0;
}

.back-btn {
  background: transparent;
  border: 1px solid var(--glass-border);
  color: var(--text-main);
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.back-btn:hover {
  background: var(--glass-bg);
  border-color: var(--accent-neon-pink);
  transform: translateX(-4px);
}

/* Grid Layout for Home */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 2rem;
  padding-top: 2rem;
}

/* Tile Component */
.tile {
  cursor: pointer;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
  position: relative;
  overflow: hidden;
}

.tile::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, transparent, rgba(255,255,255,0.03));
  pointer-events: none;
}

.tile:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
  border-color: var(--accent-neon-purple);
}

.tile .icon {
  font-size: 4rem;
  margin-bottom: 1rem;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
  transition: transform 0.3s ease;
}

.tile:hover .icon {
  transform: scale(1.1);
}

.tile h2 {
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
  font-weight: 600;
}

.tile p {
  color: var(--text-muted);
  font-size: 0.95rem;
}

/* Situation View Header */
.situation-header {
  text-align: center;
  margin-bottom: 3rem;
  animation: fadeInDown 0.6s ease;
}

.situation-header h2 {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
}

.situation-header p {
  color: var(--text-muted);
  font-size: 1.1rem;
}

/* Step Diagram Container */
.steps-container {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  max-width: 800px;
  margin: 0 auto;
  padding-bottom: 4rem;
}

/* Step Card */
.step-card {
  padding: 1.5rem;
  border-radius: var(--card-radius);
  position: relative;
  animation: fadeInUp 0.5s ease backwards;
}

.step-card.staff {
  background: var(--staff-bg);
  border: 1px solid var(--staff-border);
  margin-right: 2rem;
  border-left: 4px solid var(--accent-neon-cyan);
}

.step-card.user {
  background: var(--user-bg);
  border: 1px solid var(--user-border);
  margin-left: 2rem;
  border-right: 4px solid var(--accent-neon-pink);
  text-align: right;
}

/* Step Indicator */
.step-number {
  position: absolute;
  top: -12px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 0.8rem;
  color: #fff;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.step-card.staff .step-number {
  left: -14px;
  background: var(--accent-neon-cyan);
}

.step-card.user .step-number {
  right: -14px;
  background: var(--accent-neon-pink);
}

.speaker-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.step-card.staff .speaker-label {
  color: var(--accent-neon-cyan);
}

.step-card.user .speaker-label {
  color: var(--accent-neon-pink);
}

.japanese {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 0.25rem;
  letter-spacing: 0.5px;
}

.romaji {
  font-size: 1.35rem; /* Increased size */
  color: var(--accent-neon-cyan); /* Make it stand out more */
  margin-bottom: 1rem;
  font-weight: 500;
}

.step-card.user .romaji {
  color: var(--accent-neon-pink);
}

.english {
  font-size: 1.1rem;
  font-weight: 500;
  margin-bottom: 0.5rem;
}

.action-tip {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px dashed rgba(255,255,255,0.1);
  font-size: 0.9rem;
  color: var(--accent-neon-purple);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.step-card.user .action-tip {
  justify-content: flex-end;
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Connectors */
.step-connector {
  width: 2px;
  height: 20px;
  background: var(--glass-border);
  margin: -0.75rem auto;
  z-index: -1;
}

/* Branches */
.branches-container {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  width: 100%;
  animation: fadeInUp 0.5s ease backwards;
}

.branches-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

.branch-card {
  display: flex;
  flex-direction: column;
}

.branch-label {
  text-align: center;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 0.75rem;
  position: relative;
}

.branch-label::before, .branch-label::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 20%;
  height: 1px;
  background: var(--glass-border);
}

.branch-label::before {
  left: 0;
}

.branch-label::after {
  right: 0;
}

/* Responsive */
@media (max-width: 768px) {
  .step-card.staff { margin-right: 0; }
  .step-card.user { margin-left: 0; }
  .container { padding: 1rem; }
  .grid { grid-template-columns: 1fr; }
  .branches-grid { grid-template-columns: 1fr; gap: 2rem; }
}

    </style>

const homeView = document.getElementById('home-view');
const situationView = document.getElementById('situation-view');
const tilesGrid = document.getElementById('tiles-grid');
const stepsContainer = document.getElementById('steps-container');
const backBtn = document.getElementById('back-btn');
const situationTitle = document.getElementById('situation-title');
const situationDesc = document.getElementById('situation-desc');

function renderHome() {
  homeView.style.display = 'block';
  situationView.style.display = 'none';
  backBtn.style.display = 'none';
  
  tilesGrid.innerHTML = '';
  situations.forEach(sit => {
    const tile = document.createElement('div');
    tile.className = 'tile glass';
    tile.innerHTML = `
      <div class="icon">${sit.icon}</div>
      <h2>${sit.title}</h2>
      <p>${sit.description}</p>
    `;
    tile.onclick = () => renderSituation(sit);
    tilesGrid.appendChild(tile);
  });
}

function renderCard(stepData, stepNum) {
    let html = `<div class="step-card ${stepData.speaker}">`;
    if (stepNum) html += `<div class="step-number">${stepNum}</div>`;
    
    html += `<div class="speaker-label">${stepData.speaker === 'staff' ? 'Staff' : 'You'}</div>`;
    if (stepData.japanese) html += `<div class="japanese">${stepData.japanese}</div>`;
    if (stepData.romaji) html += `<div class="romaji">${stepData.romaji}</div>`;
    if (stepData.english) html += `<div class="english">"${stepData.english}"</div>`;
    
    if (stepData.action) {
        html += `<div class="action-tip"><span class="icon">💡</span> ${stepData.action}</div>`;
    }
    html += `</div>`;
    return html;
}

function renderSituation(sit) {
  homeView.style.display = 'none';
  situationView.style.display = 'block';
  backBtn.style.display = 'flex';
  
  situationTitle.innerHTML = `<span class="icon">${sit.icon}</span> ${sit.title}`;
  situationDesc.innerText = sit.description;
  
  let html = '';
  sit.steps.forEach((step, index) => {
    if (step.branches) {
      html += `<div class="branches-container"><div class="branches-grid">`;
      step.branches.forEach((branch, bIdx) => {
        html += `<div class="branch-card">
          <div class="branch-label">${branch.label}</div>
          ${renderCard(branch, `${index + 1}${String.fromCharCode(97 + bIdx)}`)}
        </div>`;
      });
      html += `</div></div>`;
    } else {
      html += `<div style="position: relative;">
        ${renderCard(step, index + 1)}
      </div>`;
    }
    
    if (index < sit.steps.length - 1) {
      html += `<div class="step-connector"></div>`;
    }
  });
  
  stepsContainer.innerHTML = html;
  window.scrollTo(0, 0);
}

backBtn.onclick = renderHome;
renderHome();
